<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Recorder</title>
  <link rel="icon" type="image/svg+xml" href="./mic.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="app">

  <header>
    <span class="wordmark">meeting recorder</span>
    <span class="wordmark-sub">record &middot; transcribe &middot; analyze</span>
  </header>

  <div class="rule"></div>

  <!-- API key -->
  <section class="section">
    <label class="field-label" for="keyInput">assemblyai api key</label>
    <div class="key-row">
      <input
        id="keyInput"
        class="key-input"
        type="password"
        placeholder="sk-&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="ghost-btn" id="keyToggle">show</button>
    </div>
    <p class="field-hint">Free at <a href="https://www.assemblyai.com/" target="_blank" rel="noopener">assemblyai.com</a> &mdash; 100&nbsp;h/month &middot; key saved in your browser</p>
  </section>

  <div class="rule"></div>

  <!-- Sources -->
  <section class="section sources-section">
    <div class="source">
      <span class="dot" id="micDot"></span>
      <div class="source-info">
        <span class="source-label">microphone</span>
        <span class="source-name" id="micTxt">not connected</span>
      </div>
      <button class="ghost-btn" id="micBtn">connect</button>
    </div>
    <div class="source-sep"></div>
    <div class="source">
      <span class="dot" id="sysDot"></span>
      <div class="source-info">
        <span class="source-label">pc audio</span>
        <span class="source-name" id="sysTxt">not connected</span>
      </div>
      <button class="ghost-btn" id="sysBtn">connect</button>
    </div>
    <p class="source-note">For PC audio: in the share dialog select <strong>Entire Screen</strong> and enable <strong>Share system audio</strong></p>
  </section>

  <div class="rule"></div>

  <!-- Stage: record button + timer + waveform -->
  <section class="stage">
    <button class="rec-btn" id="recBtn" disabled>
      <span class="rec-icon" id="recIcon"></span>
    </button>
    <div class="stage-live" id="recUI" hidden>
      <div class="timer" id="timer">00:00:00</div>
      <canvas id="waveCanvas" height="48"></canvas>
    </div>
    <span class="rec-lbl" id="recLbl">click to record</span>
  </section>

  <!-- Download -->
  <div id="dlCard" hidden>
    <div class="rule"></div>
    <section class="section file-section">
      <div class="file-row">
        <div class="file-info">
          <span class="file-name" id="dlName">meeting.wav</span>
          <span class="file-meta" id="dlMeta"></span>
        </div>
        <button class="outline-btn" id="dlBtn">download</button>
      </div>
    </section>
  </div>

  <!-- Transcript -->
  <div id="txCard" hidden>
    <div class="rule"></div>
    <section class="section tx-section">
      <div class="tx-progress" id="txProgress">
        <span class="pulse-dot" id="txSpinner"></span>
        <span class="tx-status-txt" id="txStatusTxt"></span>
      </div>
      <div id="txContent" hidden>
        <div class="tx-top">
          <span class="tx-meta" id="txMeta"></span>
          <div class="tx-actions">
            <button class="solid-btn" id="copyBtn">copy for claude</button>
            <button class="ghost-btn" id="saveTxtBtn">save .txt</button>
          </div>
        </div>
        <div class="tx-rule"></div>
        <div class="tx-feed" id="txScroll"></div>
      </div>
    </section>
  </div>

  <!-- New recording -->
  <div id="newWrap" hidden>
    <div class="rule"></div>
    <section class="section" style="text-align:center;padding-top:14px;padding-bottom:14px;">
      <button class="new-btn" id="newBtn">start a new recording</button>
    </section>
  </div>

</div>
<script type="module" src="./main.js"></script>
</body>
</html>
